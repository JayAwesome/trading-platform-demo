<!DOCTYPE html>
<html>
<head>
  <title>Perpetual Trading</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a href="index.html">⬅ Home</a>
</header>

<div class="layout">

  <div class="chart">
    <div id="tv"></div>
  </div>

  <div class="card">
    <h3>Perpetual Trade</h3>

    <select id="leverage">
      <option>2x</option>
      <option>5x</option>
      <option>10x</option>
    </select>

    <div class="tabs">
      <button class="active" onclick="setType('market', this)">Market</button>
      <button onclick="setType('limit', this)">Limit</button>
      <button onclick="setType('stop', this)">Stop</button>
    </div>

    <input placeholder="Price">
    <input placeholder="Amount">

    <button class="long" onclick="futuresOrder('Long')">Long</button>
    <button class="short" onclick="futuresOrder('Short')">Short</button>
  </div>

</div>

<!-- Floating Position -->
<div class="positions">
  <h4>Open Position</h4>
  <p>Type: <span id="posType">—</span></p>
  <p>Entry: <span id="entry">—</span></p>
  <p>P/L: <span id="pl">$0.00</span></p>
  <button onclick="closePosition()">Close</button>
</div>

<script src="js/app.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  container_id: "tv",
  symbol: "BTCUSDT",
  interval: "5",
  theme: "dark",
  width: "100%",
  height: 400
});
</script>
</body>
</html>
